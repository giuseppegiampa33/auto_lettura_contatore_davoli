version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: davoli_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: autolettura
      MYSQL_USER: davoli_user
      MYSQL_PASSWORD: davoli_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - davoli_net

  minio:
    image: minio/minio
    container_name: davoli_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    networks:
      - davoli_net

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c " /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin; /usr/bin/mc mb myminio/autolettura-uploads; /usr/bin/mc anonymous set public myminio/autolettura-uploads; exit 0; "
    networks:
      - davoli_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: davoli_backend
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3001:3000"
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USER: davoli_user
      DATABASE_PASSWORD: davoli_password
      DATABASE_NAME: autolettura
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:3001/uploads
      S3_BUCKET: autolettura-uploads
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      JWT_SECRET: supersecretjwtkey
    depends_on:
      - mysql
      - minio
    networks:
      - davoli_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: davoli_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm run build && npm start"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
    networks:
      - davoli_net

networks:
  davoli_net:


volumes:
  mysql_data:
  minio_data:
